# --------------------------------------------------
# Reconciliator Tuned PostgreSQL Configuration
# --------------------------------------------------
listen_addresses = '*'
max_connections = 100

# Memory settings (tuned for fast ingestion and index building)
shared_buffers = 1GB
work_mem = 64MB
maintenance_work_mem = 256MB
effective_cache_size = 3GB

# WAL and checkpoint tuning for bulk write throughput
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 512MB
synchronous_commit = off

# Disk planner settings for SSD / NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

# Default client encoding
client_encoding = 'UTF8'

