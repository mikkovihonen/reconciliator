# --------------------------------------------------
# Reconciliator Tuned PostgreSQL Configuration
# --------------------------------------------------
listen_addresses = '*'
max_connections = 100

# --------------------------------------------------
# Memory Settings
# Scaled for Podman machine with 32 GB RAM (on 64 GB host)
#   If Podman is given 16 GB: shared_buffers = 6GB,  effective_cache_size = 12GB, maintenance_work_mem = 1GB
#   If Podman is given 32 GB: shared_buffers = 12GB, effective_cache_size = 24GB, maintenance_work_mem = 2GB
#   If Podman is given 48 GB: shared_buffers = 18GB, effective_cache_size = 36GB, maintenance_work_mem = 4GB
# --------------------------------------------------
shared_buffers = 12GB
effective_cache_size = 24GB
work_mem = 64MB
maintenance_work_mem = 2GB

# GIN index pending list buffer (prevents frequent insertion stalls during bulk ingestion)
gin_pending_list_limit = 64MB

# --------------------------------------------------
# WAL and Checkpoint Tuning for Bulk Ingestion
# --------------------------------------------------
wal_buffers = 32MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 16GB
min_wal_size = 1GB
synchronous_commit = off

# --------------------------------------------------
# Parallel Workers & Concurrency
# --------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --------------------------------------------------
# Disk Planner Settings for SSD / NVMe
# --------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# Default client encoding
client_encoding = 'UTF8'

