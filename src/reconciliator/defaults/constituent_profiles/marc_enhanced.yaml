# MARC 21 as catalogued in Melinda: an *enhanced* contents note plus name-title
# analytic added entries.
#
# The indicator filters are the substance of this profile, not decoration. A
# basic 505 (ind2 blank) holds one `$a` blob - "Cantus arcticus -- Angel of light
# -- Isle of bliss" - which cannot be split into titles reliably, so this profile
# does not claim it: no constituents is right, and three wrong works is not.
name: marc_enhanced
shape: embodied
dedup: normalized_title
max_per_record: 100

fields:
  # 505 enhanced contents note. One $t per constituent, in tracklist order.
  - tag: "505"
    indicators:
      ind1: "0"
      ind2: "0"
    title: "t"
    creator: "r"        # statement of responsibility for that constituent
    duration: "g"       # "(4:32)" on sound recordings
    ordinal: position

  # 700 name-title analytic added entry. $a is the constituent's creator, not
  # the container's, which is why contributes_to_container is false; and it is an
  # authority-controlled form, so when a track appears here *and* in the contents
  # note, this is the name to keep - "Rautavaara, Einojuhani" over the note's
  # transcribed "Rautavaara".
  - tag: "700"
    indicators:
      ind2: "2"
    title: "t"
    creator: "a"
    duration: "g"
    ordinal: position
    contributes_to_container: false
    creator_controlled: true

  # 710 the same, for a corporate body.
  - tag: "710"
    indicators:
      ind2: "2"
    title: "t"
    creator: "a"
    ordinal: position
    contributes_to_container: false
    creator_controlled: true

  # 730 uniform title added entry (common in music anthologies and songbooks)
  - tag: "730"
    title: "a"
    creator: "g"
    ordinal: position
    contributes_to_container: false
    creator_controlled: true

  # 740 uncontrolled analytical title
  - tag: "740"
    indicators:
      ind2: "2"
    title: "a"
    ordinal: position
    contributes_to_container: false

  # 773 host item: this record is itself a part, so its own manifestation is a
  # component of the host's.
  #
  # $w carries the host's record control number, and it is the only subfield here
  # that identifies a row rather than describing one. The `citation` key is not
  # usable for this: it is ISSN::year::page::author, which identifies the
  # *article* and matches nothing on the host record.
  - tag: "773"
    shape: component
    component_type: article
    title: "t"
    creator: "a"
    # $q is MARC's "enumeration and first page", and it is what the existing
    # `citation` key already reads for the start page. $g is "related parts" - a
    # composite like "2020, s. 12-34" - so mapping pagination to it stores a
    # volume and a year in a column named for pages. A source that does write its
    # pages in $g says so in its own profile.
    pagination: "q"
    container_source_id: "w"
    ordinal: none
