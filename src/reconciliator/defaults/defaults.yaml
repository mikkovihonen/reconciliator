      wikidata_properties: ["P236", "P7363"]
    doi:
      strip_resolver_prefixes:
        - "https://doi.org/"
        - "http://doi.org/"
        - "https://dx.doi.org/"
        - "http://dx.doi.org/"
        - "doi:"
      pattern: '(?i)(10\.\d{4,9}/[-._;()/:A-Za-z0-9]+)'
      wikidata_properties: ["P356"]
    urn:
      patterns:
        - '(?i)(urn:nbn:[^\s]+)'
        - '(?i)(urn:[a-z0-9][a-z0-9-]{0,31}:[^\s]+)'

