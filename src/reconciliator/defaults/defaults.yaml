    sv: "sv"
    swe: "sv"
    en: "en"
    eng: "en"

  ingest_pref_label_languages: null
  ingest_alt_label_languages: null

  subject_fields:
    "648":
      category: "chronological"
      default_vocab: "yso-aika"
      allowed_vocabs: ["yso-aika", "yso"]
    "650":
      category: "topical"
      default_vocab: "yso"
      allowed_vocabs: ["yso", "kauno", "muso", "slm", "seko"]
    "651":
      category: "geographic"
      default_vocab: "yso-paikat"
      allowed_vocabs: ["yso-paikat", "yso"]
    "655":
      category: "genre_form"
      default_vocab: "slm"
      allowed_vocabs: ["slm", "seko"]
    "382":
      category: "medium_of_performance"
      default_vocab: "seko"
      allowed_vocabs: ["seko", "muso", "yso"]

  vocabulary_patterns:
    KANTO:
      - "urn.fi/urn:nbn:fi:au:pn:"
      - "(fi-asteri-n)"
      - "(fi-kanto)"
      - "asteri"
      - "kanto:"
    YSO:
      - "yso.fi/onto/yso/"
      - "(fi-yso)"
      - "yso:"
    YSO-AIKA:
      - "yso.fi/onto/yso-aika/"
      - "(fi-yso-aika)"
      - "yso-aika:"
    MUSO:
      - "yso.fi/onto/muso/"
      - "(fi-muso)"
      - "muso:"
    KAUNO:
      - "yso.fi/onto/kauno/"
      - "(fi-kauno)"
      - "kauno:"
    SLM:
      - "urn.fi/urn:nbn:fi:au:slm:"
      - "(fi-slm)"
      - "slm:"
    SEKO:
      - "urn.fi/urn:nbn:fi:au:seko:"
      - "(fi-seko)"
      - "seko:"
    MTS:
      - "urn.fi/urn:nbn:fi:au:mts:"
      - "finto.fi/mts"
      - "(fi-mts)"
      - "mts:"
    VIAF:
      - "viaf.org/viaf/"
      - "(viaf)"
      - "viaf:"
    ISNI:
      - "isni.org/isni/"
      - "(isni)"
      - "isni:"
    WIKIDATA:
      - "wikidata.org/entity/"
      - "wikidata.org/wiki/"
      - "wikidata:"

  concept_id_rules:
    KANTO:
      prefix: "kanto"
      uri_template: "https://urn.fi/URN:NBN:fi:au:pn:{id}"
      id_patterns:
        - '(?i)au:pn:(\d+)'
        - '(?i)\(fi-asteri-n\)(\d+)'
        - '(?i)\(fi-kanto\)(\d+)'
        - '(?i)(?:^|:)kanto:(\d+)'
        - '^(\d{9})$'
      canonical_id_case: "preserve"
    YSO:
      prefix: "yso"
      uri_template: "http://www.yso.fi/onto/yso/{id}"
      id_patterns:
        - '(?i)onto/yso/(p\d+)'
        - '(?i)\(fi-yso\)(p\d+)'
        - '(?i)(?:^|:)yso:(p\d+)'
        - '^(p\d+)$'
      canonical_id_case: "lower"
    YSO-AIKA:
      prefix: "yso-aika"
      uri_template: "http://www.yso.fi/onto/yso-aika/{id}"
      id_patterns:
        - '(?i)onto/yso-aika/(p\d+)'
        - '(?i)\(fi-yso-aika\)(p\d+)'
        - '(?i)(?:^|:)yso-aika:(p\d+)'
        - '^(p\d+)$'
      canonical_id_case: "lower"
    MUSO:
      prefix: "muso"
      uri_template: "http://www.yso.fi/onto/muso/{id}"
      id_patterns:
        - '(?i)onto/muso/(p\d+)'
        - '(?i)\(fi-muso\)(p\d+)'
        - '(?i)(?:^|:)muso:(p\d+)'
        - '^(p\d+)$'
      canonical_id_case: "lower"
    KAUNO:
      prefix: "kauno"
      uri_template: "http://www.yso.fi/onto/kauno/{id}"
      id_patterns:
        - '(?i)onto/kauno/(k\d+)'
        - '(?i)\(fi-kauno\)(k\d+)'
        - '(?i)(?:^|:)kauno:(k\d+)'
        - '^(k\d+)$'
      canonical_id_case: "lower"
    SLM:
      prefix: "slm"
      uri_template: "http://urn.fi/URN:NBN:fi:au:slm:{id}"
      id_patterns:
        - '(?i)au:slm:(s\d+)'
        - '(?i)\(fi-slm\)(s\d+)'
        - '(?i)(?:^|:)slm:(s\d+)'
        - '^(s\d+)$'
      canonical_id_case: "lower"
    SEKO:
      prefix: "seko"
      uri_template: "http://urn.fi/URN:NBN:fi:au:seko:{id}"
      id_patterns:
        - '(?i)au:seko:(s\d+)'
        - '(?i)\(fi-seko\)(s\d+)'
        - '(?i)(?:^|:)seko:(s\d+)'
        - '^(s\d+)$'
      canonical_id_case: "lower"
    MTS:
      prefix: "mts"
      uri_template: "http://urn.fi/URN:NBN:fi:au:mts:{id}"
      id_patterns:
        - '(?i)au:mts:(m\d+)'
        - '(?i)\(fi-mts\)(m\d+)'
        - '(?i)(?:^|:)mts:(m\d+)'
        - '^(m\d+)$'
      canonical_id_case: "lower"
    WIKIDATA:
      prefix: "wikidata"
      uri_template: "http://www.wikidata.org/entity/{id}"
      id_patterns:
        - '(?i)entity/(Q\d+)'
        - '(?i)wiki/(Q\d+)'
        - '(?i)(?:^|:)wikidata:(Q\d+)'
        - '^(Q\d+)$'
      canonical_id_case: "upper"
    VIAF:
      prefix: "viaf"
      uri_template: "http://viaf.org/viaf/{id}"
      id_patterns:
        - '(?i)viaf/(\d+)'
        - '(?i)\(viaf\)(\d+)'
        - '(?i)(?:^|:)viaf:(\d+)'
        - '^(\d+)$'
      canonical_id_case: "preserve"
    ISNI:
      prefix: "isni"
      uri_template: "http://isni.org/isni/{id}"
      id_patterns:
        - '(?i)isni/([0-9X]{16})'
        - '(?i)\(isni\)([0-9X]{16})'
        - '(?i)(?:^|:)isni:([0-9X]{16})'
        - '^([0-9X]{16})$'
      canonical_id_case: "upper"
    ORCID:
      prefix: "orcid"
      uri_template: "https://orcid.org/{id}"
      id_patterns:
        - '(?i)orcid\.org/([0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])'
        - '(?i)(?:^|:)orcid:([0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])'
        - '^([0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])$'
      canonical_id_case: "preserve"
    SERIES:
      prefix: "series"
      uri_template: "urn:reconciliator:series:{id}"
      id_patterns:
        - '(?i)urn:reconciliator:series:(.+)'
        - '(?i)(?:^|:)series:(.+)'
      canonical_id_case: "preserve"

