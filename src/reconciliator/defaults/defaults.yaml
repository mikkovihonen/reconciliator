  hierarchy:
    enabled: true
    max_traversal_depth: 10
    max_expansion_depth: 2
    path_decay_factor: 0.85
    similarity_algorithm: "path_decay"
    min_similarity_threshold: 0.60
    cache_graphs: true
    hierarchical_vocabularies:
      - "yso"
      - "yso-aika"
      - "yso-paikat"
      - "kauno"
      - "muso"
      - "slm"
      - "seko"

