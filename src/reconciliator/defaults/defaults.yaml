# defaults.yaml - Canonical Package Defaults for Reconciliator
#
# Single Source of Truth for baseline linguistic rules, controlled vocabularies,
# record normalization heuristics, and native format enrichment settings.

linguistic:
  default_language: "fi"
  preserved_diacritics: "åäöÅÄÖ"
  biographical_dates:
    prefixes:
      - "ca."
      - "circa"
      - "n."
      - "s."
      - "f."
      - "b."
      - "k."
      - "d."
      - "fl."
      - "floruit"
      - "born"
      - "died"
      - "död"
      - "syntynyt"
      - "kuollut"
    era_bc:
      - "eaa."
      - "ekr."
      - "f.kr."
      - "bc"
      - "bce"
    era_ad:
      - "jaa."
      - "jkr."
      - "ad"
    century_suffixes:
      - "luku"
      - "talet"
      - "l."
      - "t."
    pattern: null

