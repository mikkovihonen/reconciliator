    uri_patterns:
      - "^https?://(?:www\\.)?wikidata\\.org/(?:wiki|entity)/"
    canonical_uri_template: "http://www.wikidata.org/entity/{identifier}"
    tag_prefixes: []
    aliases: []
    identifier_pattern: "^Q\\d+$"
    uppercase_identifier: true
    subfield: "1"
  isni:
    uri_patterns:
      - "^https?://(?:www\\.)?isni\\.org/isni/"
    canonical_uri_template: "https://isni.org/isni/{identifier}"
    tag_prefixes: ["isni"]
    aliases: []
    subfield: "0"
  viaf:
    uri_patterns:
      - "^https?://viaf\\.org/viaf/"
    canonical_uri_template: "https://viaf.org/viaf/{identifier}"
    tag_prefixes: ["viaf"]
    aliases: []
    subfield: "0"
  orcid:
    uri_patterns:
      - "^https?://orcid\\.org/"
    canonical_uri_template: "https://orcid.org/{identifier}"
    tag_prefixes: ["orcid"]
    aliases: []
    subfield: "0"
  kanto:
    uri_patterns:
      - "^https?://urn\\.fi/URN:NBN:fi:au:pn:"
      - "^https?://urn\\.fi/URN:NBN:fi:au:cn:"
    canonical_uri_template: "http://urn.fi/URN:NBN:fi:au:pn:{identifier}"
    tag_prefixes: ["(fi-asteri-n)", "asteri", "kanto"]
    aliases: ["finaf", "asteri"]
    subfield: "0"
  melinda:
    uri_patterns: []
    canonical_uri_template: null
    tag_prefixes: ["(fin11)", "melinda"]
    aliases: []
    subfield: "0"
  slm:
