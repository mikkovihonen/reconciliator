# defaults.yaml - Canonical Package Defaults for Reconciliator
#
# Single Source of Truth for baseline linguistic rules, controlled vocabularies,
# record normalization heuristics, and native format enrichment settings.

compute:
  device: "auto"
  threads: null

storage:
  data_dir: "data"
  postgres:
    host: "localhost"
    port: 5432
    database: "reconciliator"
    user: "postgres"
    password: "postgres"
    database_url: null
    pool_size: 10
    max_overflow: 20
    pool_timeout: 30.0
    pool_recycle: 1800
    pool_pre_ping: true
    shared_buffers: "1GB"
    work_mem: "64MB"
    maintenance_work_mem: "256MB"
    effective_cache_size: "3GB"
    random_page_cost: 1.1
    synchronous_commit: "off"
    container_name: "reconciliator-pg"
    container_image: "docker.io/library/postgres:16-alpine"
    container_timeout_seconds: 30.0
    auto_start_container: true
    locale: null
    lc_collate: null
    lc_ctype: null
    initdb_args: null
    max_parameters_per_batch: 32767
    default_chunk_size: null
    data_dir: null
  vector_engine:
    backend: "auto"
    device: "auto"
    mode: "embedded"
    threads: null
    torch:
      dtype: "float32"
      mmap: false
      chunk_size: 50000
      initial_capacity: 10000
    faiss:
      index_type: "flat"
      mmap: false
      nprobe: 16
      nlist: 2048
    usearch:
      metric: "cos"
      dtype: "f16"
      connectivity: 16
      expansion_add: 128
      expansion_search: 64
      mmap: true
    daemon:
      enabled: true
      socket_path: null
      auto_start: true
      idle_timeout_seconds: 1800
      auto_save_interval_seconds: 60
      heartbeat_interval_seconds: 2.0
      max_batch_bytes: 67108864
  fts:
    ranking_function: "bm25"
    column_weights: null
    default_limit: 20
    prefix_search: false

telemetry:
  heartbeat_interval_seconds: 60.0
  watch_interval_seconds: 5.0
  stale_heartbeat_timeout_seconds: 120.0
  adopt_previous_task_id: true
  show_vector_daemon: true

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  log_file: null
  capture_warnings: false

vector_model: "embedding"

embedding:
  model_name: "TurkuNLP/sbert-cased-finnish-paraphrase"
  template_path: "reconciliator/templates/default_serialization.j2"
  device: "auto"
  batch_size: 64
  vector_dim: null
  force_template: false
  max_seq_length: null
  cuda_batch_scale: 4
  mps_batch_scale: 2
  num_cpu_threads: null

llm:
  backend: "auto"
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  quantization: "8bit"
  device: "auto"
  torch_dtype: "auto"
  attn_implementation: "auto"
  pooling_strategy: "last_token"
  batch_size: 16
  positive_token: "YES"
  negative_token: "NO"
  target_template: "Instruct: Given a bibliographic record, retrieve matching catalog works.\nQuery: {text}\n"
  candidate_suffix_template: "Candidate: {text}\nDoes this refer to the same work? Answer YES or NO: "
  max_seq_length: 2048

linguistic:
  default_language: "fi"
  preserved_diacritics: "åäöÅÄÖ"
  biographical_dates:
    prefixes:
      - "ca."
      - "circa"
      - "n."
      - "s."
      - "f."
      - "b."
      - "k."
      - "d."
      - "fl."
      - "floruit"
      - "born"
      - "died"
      - "död"
      - "syntynyt"
      - "kuollut"
    era_bc:
      - "eaa."
      - "ekr."
      - "f.kr."
      - "bc"
      - "bce"
    era_ad:
      - "jaa."
      - "jkr."
      - "ad"
    century_suffixes:
      - "luku"
      - "talet"
      - "l."
      - "t."
    pattern: null

vocabularies:
  agent_priority:
    - "KANTO_PN"
    - "KANTO_CN"
    - "ISNI"
    - "VIAF"
    - "WIKIDATA"

  subject_priority:
    - "YSO"
    - "YSO-AIKA"
    - "KAUNO"
    - "MUSO"
    - "SLM"
    - "SEKO"
    - "WIKIDATA"

  entity_vocabularies:
