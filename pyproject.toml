[project]
name = "reconciliator"
version = "0.1.0"
description = "High-Performance Finnish Bibliographic Authority Reconciliation & Agent URI Enrichment Engine"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mikko Vihonen", email = "mikko.vihonen@iki.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.8.0",
    "httpx2>=0.1.0",
    "jinja2>=3.1.0",
    "lxml>=5.2.0",
    "orjson>=3.10.0",
    "pydantic>=2.7.0",
    "pymarc>=5.1.0",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9.0",
    "rich>=13.7.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "zensical>=0.0.60",
]

[project.scripts]
reconciliator = "reconciliator:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "lxml.*",
    "yaml.*",
    "rank_bm25.*",
    "faiss.*",
    "sentence_transformers.*",
    "torch.*",
    "rapidfuzz.*",
]
ignore_missing_imports = true
