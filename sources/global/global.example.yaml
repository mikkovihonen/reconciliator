# sources/global/global.example.yaml - Modular Global Rules & Vocabularies Configuration
#
# Defines baseline linguistic conventions, vocabulary policies, record normalization,
# and enrichment settings that can be imported as external modular files in config.yaml.

linguistic:
  default_language: "fi"
  preserved_diacritics: "åäöÅÄÖ"
  biographical_dates:
    prefixes:
      - "ca."
      - "circa"
      - "n."
      - "s."
      - "f."
      - "b."
      - "k."
      - "d."
      - "fl."
      - "floruit"
      - "born"
      - "died"
      - "död"
      - "syntynyt"
      - "kuollut"
    era_bc:
      - "eaa."
      - "ekr."
      - "f.kr."
      - "bc"
      - "bce"
    era_ad:
      - "jaa."
      - "jkr."
      - "ad"
    century_suffixes:
      - "luku"
      - "talet"
      - "l."
      - "t."
    pattern: null

vocabularies:
  agent_priority:
    - "KANTO"
    - "ISNI"
    - "VIAF"
    - "WIKIDATA"

  subject_priority:
    - "YSO"
    - "YSO-AIKA"
    - "KAUNO"
    - "MUSO"
    - "SLM"
    - "SEKO"
    - "WIKIDATA"

  entity_vocabularies:
    - "WIKIDATA"

  supported_subjects:
    - "yso"
    - "yso-aika"
    - "yso-paikat"
    - "kauno"
    - "muso"
    - "slm"
    - "seko"
    - "koko"
    - "wikidata"

  download_list:
    - "yso"
    - "yso-paikat"
    - "kauno"
    - "muso"
    - "slm"
    - "seko"

  legacy_to_modern:
    ysa: "yso"
    allars: "yso"
    kaunokki: "kauno"
    bella: "kauno"
    musa: "yso"
    muso: "yso"
    cilla: "seko"

  thesaurus_languages:
    ysa: "fi"
    allars: "sv"
    kaunokki: "fi"
    bella: "sv"
    musa: "fi"
    muso: "fi"
    cilla: "sv"

  language_subcode_vocabularies:
    yso: "fin"
    yso-aika: "fin"
    yso-paikat: "fin"
    kauno: "fin"
    slm: "fin"

  vocabulary_code_map:
    yso: "yso"
    yso-aika: "yso"
    yso-paikat: "yso"

  language_subcode_suffixes:
    fi: "fin"
    fin: "fin"
    sv: "swe"
    swe: "swe"
    en: "eng"
    eng: "eng"

  preferred_label_languages:
    - "fi"
    - "sv"
    - "en"

  default_label_language: "record"
  vocabulary_label_languages: {}

  language_code_map:
    fi: "fi"
    fin: "fi"
    sv: "sv"
    swe: "sv"
    en: "en"
    eng: "en"

  subject_fields:
    "648":
      category: "chronological"
      default_vocab: "yso-aika"
      allowed_vocabs: ["yso-aika", "yso"]
    "650":
      category: "topical"
      default_vocab: "yso"
      allowed_vocabs: ["yso", "kauno", "muso", "slm", "seko"]
    "651":
      category: "geographic"
      default_vocab: "yso-paikat"
      allowed_vocabs: ["yso-paikat", "yso"]
    "655":
      category: "genre_form"
      default_vocab: "slm"
      allowed_vocabs: ["slm", "seko"]
    "382":
      category: "medium_of_performance"
      default_vocab: "seko"
      allowed_vocabs: ["seko", "muso", "yso"]

record_normalization:
  non_filing_articles:
    fi: ["yksi ", "eräs "]
    sv: ["en ", "ett ", "den ", "det ", "de "]
    en: ["the ", "a ", "an "]
    de: ["der ", "die ", "das ", "ein ", "eine "]
    fr: ["le ", "la ", "les ", "un ", "une ", "l'"]

  publisher_suffixes:
    - "oy"
    - "oyj"
    - "ab"
    - "abp"
    - "ltd"
    - "inc"
    - "corp"
    - "gmbh"
    - "kustannus"
    - "kustannusosakeyhtiö"
    - "förlag"
    - "publishing"

  volume_prefixes:
    - "osa"
    - "del"
    - "vol"
    - "volume"
    - "bd"
    - "band"
    - "tome"
    - "t"
    - "v"
