# config.yaml - Complete Configuration Surface for Reconciliator

# 1. Storage & Persistence File Paths
storage:
  authority_db: "data/authority.db"
  vocab_db: "data/vocab.db"
  progress_db: "data/progress.db"
  index_path: "data/authority.index"
  vector_engine:
    backend: "auto"       # "auto" | "faiss" | "torch" ("auto" selects torch on MPS/CUDA, faiss on CPU)
    device: "auto"        # "auto" | "mps" | "cuda" | "cpu" (for torch backend)
    threads: null         # Optional thread count override for FAISS OpenMP (defaults to 1 on macOS)

# 2. Embedding Model, Serialization Template & Hardware Acceleration
embedding:
  model_name: "TurkuNLP/sbert-cased-finnish-paraphrase"
  template_path: "reconciliator/templates/default_serialization.j2"
  device: "auto"        # "auto" | "cuda" | "mps" | "cpu"
  batch_size: 64        # Inference batch size for dense sentence embedding
  force_template: false # When true, permits reconciliation even if template hash differs from index metadata

# 3. Skosmos Value Vocabularies Downloader (multi-source, e.g. FINTO, AGROVOC)
# Can reference modular files, directories, or define sources inline:
download_skosmos:
  finto: "sources/skosmos/finto.example.yaml"

# 4. Value Vocabularies & Migration Ingestion
ingest_vocab:
  input_path: "data/vocabularies" # Directory or file path containing SKOS / Turtle / RDF dumps
  vocabularies:
    - "yso"
    - "yso-paikat"
    - "kauno"
    - "muso"
    - "slm"
    - "seko"
  legacy_thesauri:
    - "ysa"
    - "allars"
    - "kaunokki"
    - "musa"

# 5. OAI-PMH & MARCXML Authority Sources Ingestion
# Can reference modular files, directories, or define sources inline:
ingest_oai:
  melinda: "sources/oai/melinda.example.yaml"


# 6. Wikidata Authority Ingestion
ingest_wikidata:
  dump_path: "data/wikidata/latest-all.json.gz"
  batch_size: 1000

# 7. Target Reconciliation & Enrichment
reconcile:
  target_file: "tests/fixtures/sample_target.xml"
  format: "auto"        # "auto" | "marcxml" | "bibra" | "bibframe"
  schema_profile: null  # Optional profile override: "bffi_1" | "bibframe_3" | "bibframe_2" | path to custom yaml
  output_file: "data/enriched_records.xml" # Enriched in the same native format as target_file
  enrich: true          # true: inject novel $0/$1 URIs or owl:sameAs; false: audit & report only
  fold_legacy: true     # true: reconcile and fold legacy subject headings against vocab.db
  threshold: 0.85       # Minimum hybrid score for candidate acceptance

  # Report Set 1: Agent & Descriptive Authority Reports (Melinda/Asteri, Wikidata, ISNI, VIAF)
  agent_reports:
    detailed_file: "data/reports/agent_reconciliation_uris.tsv"     # Row per reconciled agent URI
    summary_file: "data/reports/agent_reconciliation_summary.tsv"   # Aggregate agent metrics

  # Report Set 2: Subject Headings Reconciliation Reports (YSO, SLM, KAUNO, MUSO, SEKO)
  subject_reports:
    detailed_file: "data/reports/subject_reconciliation_uris.tsv"   # Row per reconciled subject URI
    summary_file: "data/reports/subject_reconciliation_summary.tsv" # Aggregate subject & thesauri metrics

  rerank:
    enabled: true       # Toggle reranking on/off (if false, pure dense scoring is used)
    engine: "bm25"      # Reranking engine backend: "bm25", "cross_encoder", "fuzzy", or "noop"
    model_name: null    # HuggingFace model path (required when engine is "cross_encoder")
    device: "auto"      # Device for neural rerankers: "auto", "cpu", "cuda", or "mps"
    batch_size: 16      # Batch inference size for cross-encoder rerankers
    dense_weight: 0.6   # Weight of dense semantic cosine similarity (0.0 - 1.0)
    rerank_weight: 0.4  # Weight of reranker similarity (0.0 - 1.0)
    top_k: 50           # Number of dense vector candidates retrieved for reranking
    short_circuit:
      enabled: true     # Fast-path shortcut: candidates with dense score >= threshold bypass reranking
      threshold: 0.98   # Configurable dense similarity threshold for short-circuiting (default 0.98)
    require_volume_match: true   # Reject conflicting volume/part numbers ("osa 1" vs "osa 2")
    require_surname_match: true  # Require at least one matching author surname token
    max_year_difference: 5       # Max allowable publication year discrepancy before disqualification
    year_penalty_threshold: 1    # Year discrepancy after which linear proximity penalty begins
  link_policy: "priority_fallback"  # "priority_fallback" or "all"
  vocabularies:
    - "KANTO"
    - "YSO"
    - "MUSO"
    - "KAUNO"
    - "SLM"
    - "SEKO"
    - "VIAF"
    - "ISNI"
    - "WIKIDATA"
  agent_priority:
    - "KANTO"
    - "ISNI"
    - "VIAF"
    - "WIKIDATA"
  subject_priority:
    - "YSO"
    - "KAUNO"
    - "MUSO"
    - "SLM"
    - "SEKO"
    - "WIKIDATA"

# 8. Telemetry & Progress Monitoring
telemetry:
  heartbeat_interval_seconds: 1.0
  watch_interval_seconds: 1.0

# 9. Global Normalization Rules
# Can be omitted to use built-in defaults, defined inline, or referenced via external file:
normalization: "sources/global/global.example.yaml"

